name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (tests do not load the embedding model)
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt minus sentence-transformers/PyTorch, which the tests never load.
          grep -v '^sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          sed 's#^-r requirements.txt#-r /tmp/requirements-ci.txt#' requirements-dev.txt > /tmp/requirements-dev-ci.txt
          pip install -r /tmp/requirements-dev-ci.txt
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://ci:ci@localhost:5432/ci' || '' }}
        run: pytest -q -W error --junitxml=reports/junit.xml --cov --cov-report=term --cov-report=xml:reports/coverage.xml
      - name: Upload test report and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-${{ matrix.database }}
          path: backend/reports/

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server-update:
    name: Server update script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          command -v shellcheck > /dev/null || sudo apt-get install -y shellcheck
          shellcheck infra/auto-update/*.sh
      - name: Test
        run: bash infra/auto-update/test_update.sh

  e2e:
    name: End-to-end (Docker Compose, real model)
    runs-on: ubuntu-latest
    env:
      E2E_BASE_URL: http://localhost
      E2E_HR_SIGNUP_CODE: ci-hr-code
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET_KEY=$(openssl rand -hex 32)"
            echo "HR_SIGNUP_CODE=$E2E_HR_SIGNUP_CODE"
          } > .env
          docker compose up -d --build --wait
      - name: Wait until the API reports ready (embedding model loaded)
        run: |
          for _ in $(seq 1 60); do curl -fsS "$E2E_BASE_URL/readyz" && exit 0; sleep 5; done
          docker compose logs backend
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install API test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          grep -v '^sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          sed 's#^-r requirements.txt#-r /tmp/requirements-ci.txt#' requirements-dev.txt > /tmp/requirements-dev-ci.txt
          pip install -r /tmp/requirements-dev-ci.txt
      - name: API end-to-end tests
        working-directory: backend
        run: pytest e2e -q -W error --junitxml=reports/e2e-junit.xml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            backend/reports/
            frontend/playwright-report/
            frontend/test-results/
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=300
