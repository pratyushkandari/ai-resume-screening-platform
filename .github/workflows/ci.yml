name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (tests do not load the embedding model)
        run: |
          python -m pip install --upgrade pip
          # requirements-dev.txt minus sentence-transformers/PyTorch, which the tests never load.
          grep -v '^sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          sed 's#^-r requirements.txt#-r /tmp/requirements-ci.txt#' requirements-dev.txt > /tmp/requirements-dev-ci.txt
          pip install -r /tmp/requirements-dev-ci.txt
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://ci:ci@localhost:5432/ci' || '' }}
        run: pytest -q -W error

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
