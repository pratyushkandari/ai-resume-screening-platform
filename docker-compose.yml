version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Database Service (PostgreSQL 15)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: resume_screening_db
    restart: always
    environment:
      POSTGRES_USER: resume_user1
      POSTGRES_PASSWORD: Resume123
      POSTGRES_DB: resume_db1
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U resume_user1 -d resume_db1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume_network

  # ---------------------------------------------------------------------------
  # Distributed Cache Service (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: resume_screening_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resume_network

  # ---------------------------------------------------------------------------
  # FastAPI Application Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_screening_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://resume_user1:Resume123@db:5432/resume_db1
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-prod-super-secret-key-change-in-production-resume-matcher-2026}
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume_network

  # ---------------------------------------------------------------------------
  # React Frontend (Nginx Production Server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_screening_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - resume_network

volumes:
  pgdata:
    driver: local

networks:
  resume_network:
    driver: bridge
