# =============================================================================
#  Kubernetes Production Deployment & Service Manifest
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-screener-backend
  labels:
    app: resume-screener-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resume-screener-backend
  template:
    metadata:
      labels:
        app: resume-screener-backend
    spec:
      containers:
        - name: backend
          image: resume-screener-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: resume-db-secrets
                  key: database-url
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: resume-app-secrets
                  key: jwt-secret
            - name: UPLOAD_DIR
              value: "/app/uploads"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: resume-screener-backend-service
spec:
  type: ClusterIP
  selector:
    app: resume-screener-backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
