# Scale the backend on CPU (embedding and scoring are CPU-bound).
# Memory is dominated by the loaded model and stays roughly constant per pod,
# so it is not a useful scaling signal.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: resume-screener-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: resume-screener-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
